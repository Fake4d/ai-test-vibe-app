<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSS Reader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3347;
      --accent: #5b8dee;
      --accent-hover: #7aa4f5;
      --text: #e8eaf0;
      --text-muted: #8891aa;
      --text-dim: #5a6280;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,.4);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 80px;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1d27 0%, #12151f 100%);
      border-bottom: 1px solid var(--border);
      padding: 32px 24px 28px;
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e8eaf0 0%, #5b8dee 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: .95rem;
    }

    /* ── Search bar ── */
    .search-bar {
      max-width: 760px;
      margin: 32px auto 0;
      display: flex;
      gap: 10px;
      padding: 0 16px;
    }

    .search-bar input {
      flex: 1;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }

    .search-bar input::placeholder { color: var(--text-dim); }

    .search-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91,141,238,.15);
    }

    .search-bar button {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 13px 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, transform .1s;
    }

    .search-bar button:hover { background: var(--accent-hover); }
    .search-bar button:active { transform: scale(.97); }

    /* ── Feed meta ── */
    #feed-meta {
      max-width: 960px;
      margin: 28px auto 0;
      padding: 0 16px;
      display: none;
    }

    .feed-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .feed-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: contain;
      background: var(--surface2);
      flex-shrink: 0;
    }

    .feed-icon-placeholder {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .feed-info h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .feed-info p {
      color: var(--text-muted);
      font-size: .88rem;
      line-height: 1.5;
    }

    .feed-badge {
      margin-left: auto;
      background: rgba(91,141,238,.15);
      color: var(--accent);
      border: 1px solid rgba(91,141,238,.3);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: .78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* ── Article grid ── */
    #articles {
      max-width: 960px;
      margin: 24px auto 0;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* ── Article card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: #3e4460;
    }

    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: var(--surface2);
      display: block;
    }

    .card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, var(--surface2) 0%, #2a2f45 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      opacity: .4;
    }

    .card-body {
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-category {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.03rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-desc {
      font-size: .88rem;
      color: var(--text-muted);
      line-height: 1.6;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .card-date {
      font-size: .8rem;
      color: var(--text-dim);
    }

    .card-link-icon {
      color: var(--accent);
      font-size: .85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transition: opacity .2s;
    }

    .card:hover .card-link-icon { opacity: 1; }

    /* ── States ── */
    #state {
      max-width: 760px;
      margin: 60px auto 0;
      padding: 0 16px;
      text-align: center;
    }

    .state-icon { font-size: 3.5rem; margin-bottom: 16px; }

    .state-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .state-sub {
      color: var(--text-muted);
      font-size: .95rem;
      line-height: 1.6;
    }

    /* Spinner */
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Article modal / overlay ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(6px);
      z-index: 100;
      overflow-y: auto;
      padding: 32px 16px 60px;
    }

    #overlay.open { display: block; }

    .modal {
      max-width: 720px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }

    .modal-hero {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
    }

    .modal-body {
      padding: 32px 36px 36px;
    }

    .modal-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .modal-category {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(91,141,238,.1);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .modal-date {
      font-size: .83rem;
      color: var(--text-dim);
    }

    .modal-title {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -.01em;
      margin-bottom: 20px;
    }

    .modal-desc {
      font-size: 1.05rem;
      line-height: 1.75;
      color: #c5c9d6;
      margin-bottom: 28px;
    }

    .modal-desc p + p { margin-top: 14px; }

    .modal-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 12px 22px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 11px 22px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .2s, color .2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .modal-body { padding: 24px 20px 28px; }
      #articles { grid-template-columns: 1fr; }
      .feed-badge { display: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>📰 RSS Reader</h1>
  <p>Gib einen RSS-Feed ein und lies die Artikel in einer schönen Ansicht</p>

  <div class="search-bar">
    <input
      type="url"
      id="url-input"
      placeholder="RSS- oder Atom-Feed URL (Standard: Tagesschau)"
      autocomplete="off"
      spellcheck="false"
    />
    <button id="load-btn">Laden</button>
  </div>
</header>

<div id="feed-meta"></div>
<div id="articles"></div>
<div id="state">
  <div class="state-icon">📡</div>
  <div class="state-title">RSS-Feed eingeben</div>
  <div class="state-sub">Gib eine Feed-URL ein oder klicke auf „Laden"<br>um den Tagesschau-Feed zu starten.</div>
</div>

<!-- Article overlay -->
<div id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Artikelansicht"></div>
</div>

<script>
  const DEFAULT_FEED = 'https://www.tagesschau.de/infoservices/alle-meldungen-100~rss2.xml';

  const urlInput  = document.getElementById('url-input');
  const loadBtn   = document.getElementById('load-btn');
  const feedMeta  = document.getElementById('feed-meta');
  const articles  = document.getElementById('articles');
  const state     = document.getElementById('state');
  const overlay   = document.getElementById('overlay');
  const modal     = document.getElementById('modal');

  // ── DOM helpers ──────────────────────────────────────────────────────────
  // All feed content goes through el()/textContent — never innerHTML — so a
  // malicious feed cannot inject markup or scripts into the page.

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  // Only http(s) URLs may become href/src; blocks javascript:/data: links.
  function sanitizeUrl(u) {
    if (!u) return '';
    try {
      const parsed = new URL(u.trim());
      if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return parsed.href;
    } catch {}
    return '';
  }

  // DOMParser documents are inert: scripts don't run, images don't load.
  // (innerHTML on a detached div is NOT safe – <img onerror> fires there.)
  function stripHtml(html) {
    if (!html) return '';
    const doc = new DOMParser().parseFromString(html, 'text/html');
    return (doc.body.textContent || '').trim();
  }

  // Extract readable paragraphs from an HTML fragment (for the modal view)
  function htmlToParagraphs(html) {
    if (!html) return [];
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const paras = [...doc.body.querySelectorAll('p')]
      .map(p => (p.textContent || '').trim())
      .filter(Boolean);
    if (paras.length) return paras;
    const text = (doc.body.textContent || '').trim();
    return text ? [text] : [];
  }

  function setState(nodes) {
    state.replaceChildren(...nodes);
    state.style.display = '';
    feedMeta.style.display = 'none';
    articles.replaceChildren();
  }

  function showLoading() {
    setState([
      el('div', 'spinner'),
      el('div', 'state-title', 'Feed wird geladen…'),
      el('div', 'state-sub', 'Einen Moment bitte.'),
    ]);
  }

  function showError(message, detail) {
    const sub = el('div', 'state-sub', message);
    if (detail) {
      sub.appendChild(document.createElement('br'));
      const small = document.createElement('small');
      small.textContent = detail;
      sub.appendChild(small);
    }
    setState([
      el('div', 'state-icon', '⚠️'),
      el('div', 'state-title', 'Fehler beim Laden'),
      sub,
    ]);
  }

  // ── Feed parsing helpers ─────────────────────────────────────────────────

  // Returns first element matching any of the tag names (with namespace prefix)
  function byTagName(scope, ...tags) {
    for (const tag of tags) {
      const found = scope.getElementsByTagName(tag);
      if (found.length) return found[0];
    }
    return null;
  }

  function getTextByTag(scope, ...tags) {
    const node = byTagName(scope, ...tags);
    return node ? (node.textContent || '').trim() : '';
  }

  // Article link: RSS <link>text</link>, Atom <link rel="alternate" href>,
  // fallback <guid isPermaLink>
  function extractLink(item) {
    const links = [...item.getElementsByTagName('link')];
    for (const l of links) {
      const text = (l.textContent || '').trim();
      if (/^https?:/i.test(text)) return text;
    }
    const alternate = links.find(l =>
      (l.getAttribute('rel') || 'alternate') === 'alternate' && l.getAttribute('href'));
    if (alternate) return alternate.getAttribute('href');
    const any = links.find(l => l.getAttribute('href'));
    if (any) return any.getAttribute('href');
    const guid = byTagName(item, 'guid');
    if (guid && /^https?:/i.test((guid.textContent || '').trim())) {
      return guid.textContent.trim();
    }
    return '';
  }

  // Find first <img src=""> in any HTML/CDATA text
  function findImgInHtml(html) {
    if (!html) return '';
    const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
    return m ? m[1] : '';
  }

  // Extract image from various RSS/Atom image fields
  function extractImage(item) {
    // 1. media:content (RSS 2.0 with Media RSS – Tagesschau, ARD, ZDF …)
    const mc = byTagName(item, 'media:content');
    if (mc) {
      const u = mc.getAttribute('url');
      if (u) return u;
    }

    // 2. media:group > media:content
    const mg = byTagName(item, 'media:group');
    if (mg) {
      const inner = mg.getElementsByTagName('media:content')[0];
      if (inner) {
        const u = inner.getAttribute('url');
        if (u) return u;
      }
    }

    // 3. media:thumbnail
    const mt = byTagName(item, 'media:thumbnail');
    if (mt) {
      const u = mt.getAttribute('url') || mt.textContent.trim();
      if (u) return u;
    }

    // 4. enclosure (RSS 2.0)
    const enc = byTagName(item, 'enclosure');
    if (enc) {
      const type = enc.getAttribute('type') || '';
      if (!type || type.startsWith('image')) {
        const u = enc.getAttribute('url');
        if (u) return u;
      }
    }

    // 5. <img> in CDATA – check Atom <content>, then <summary>,
    //    then RSS <description> / <content:encoded>
    for (const tag of ['content', 'summary', 'description', 'content:encoded']) {
      const node = item.getElementsByTagName(tag)[0];
      if (node) {
        const img = findImgInHtml(node.textContent || '');
        if (img) return img;
      }
    }

    // 6. itunes:image
    const itunes = byTagName(item, 'itunes:image');
    if (itunes) {
      const u = itunes.getAttribute('href') || itunes.getAttribute('url');
      if (u) return u;
    }

    // 7. XMLSerializer fallback – catches anything else
    try {
      const raw = new XMLSerializer().serializeToString(item);
      const m = raw.match(/(?:url|href|src)=["'](https?:\/\/[^"']+\.(?:jpe?g|png|webp|gif|avif)[^"']*)["']/i)
            || raw.match(/<img[^>]+src=["']([^"']+)["']/i)
            || raw.match(/(?:url|href)=["'](https?:\/\/[^"']*?images?[^"']*)["']/i);
      if (m) return m[1];
    } catch {}

    return '';
  }

  // RSS: <category>Text</category> — Atom: <category term="…"/>
  function extractCategory(item) {
    const cat = byTagName(item, 'category');
    if (!cat) return '';
    return (cat.textContent || '').trim() || (cat.getAttribute('term') || '').trim();
  }

  function parseItemDate(item) {
    const str = getTextByTag(item, 'pubDate', 'published', 'updated', 'dc:date');
    if (!str) return null;
    const d = new Date(str);
    return isNaN(d.getTime()) ? null : d;
  }

  function fullDate(d) {
    return d.toLocaleDateString('de-DE', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit',
    }) + ' Uhr';
  }

  // "vor 5 Min." / "vor 3 Std." for fresh news, absolute date otherwise
  function formatDate(d) {
    if (!d) return '';
    const mins = Math.floor((Date.now() - d.getTime()) / 60000);
    if (mins < 1) return 'gerade eben';
    if (mins < 60) return `vor ${mins} Min.`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `vor ${hours} Std.`;
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  // Normalize one <item>/<entry> into a plain article object
  function parseItem(item) {
    const rawSummary = getTextByTag(item, 'description', 'summary');
    const fullHtml = getTextByTag(item, 'content:encoded', 'content') || rawSummary;
    return {
      title: getTextByTag(item, 'title') || 'Ohne Titel',
      link: sanitizeUrl(extractLink(item)),
      desc: stripHtml(rawSummary),
      paragraphs: htmlToParagraphs(fullHtml),
      date: parseItemDate(item),
      cat: extractCategory(item),
      imgUrl: sanitizeUrl(extractImage(item)),
    };
  }

  // ── Render ───────────────────────────────────────────────────────────────

  function makeThumbPlaceholder() {
    return el('div', 'card-thumb-placeholder', '📄');
  }

  function renderFeedMeta(channel, count) {
    const title = getTextByTag(channel, 'title') || 'RSS Feed';
    const desc = stripHtml(getTextByTag(channel, 'description', 'subtitle'));

    let iconUrl = '';
    const imageEl = byTagName(channel, 'image');       // RSS <image><url>
    if (imageEl) iconUrl = getTextByTag(imageEl, 'url');
    if (!iconUrl) iconUrl = getTextByTag(channel, 'icon', 'logo'); // Atom
    iconUrl = sanitizeUrl(iconUrl);

    const header = el('div', 'feed-header');

    if (iconUrl) {
      const icon = el('img', 'feed-icon');
      icon.src = iconUrl;
      icon.alt = '';
      icon.setAttribute('referrerpolicy', 'no-referrer');
      icon.addEventListener('error', () => icon.replaceWith(el('div', 'feed-icon-placeholder', '📰')));
      header.appendChild(icon);
    } else {
      header.appendChild(el('div', 'feed-icon-placeholder', '📰'));
    }

    const info = el('div', 'feed-info');
    info.appendChild(el('h2', '', title));
    if (desc) info.appendChild(el('p', '', desc));
    header.appendChild(info);
    header.appendChild(el('span', 'feed-badge', `${count} Artikel`));

    feedMeta.replaceChildren(header);
    feedMeta.style.display = 'block';
    state.style.display = 'none';
  }

  function makeCard(article) {
    const card = el('a', 'card');
    card.href = article.link || '#';
    card.setAttribute('aria-label', article.title);

    if (article.imgUrl) {
      const img = el('img', 'card-thumb');
      img.src = article.imgUrl;
      img.alt = '';
      img.setAttribute('loading', 'lazy');
      img.setAttribute('referrerpolicy', 'no-referrer');
      img.addEventListener('error', () => img.replaceWith(makeThumbPlaceholder()));
      card.appendChild(img);
    } else {
      card.appendChild(makeThumbPlaceholder());
    }

    const body = el('div', 'card-body');
    if (article.cat) body.appendChild(el('div', 'card-category', article.cat));
    body.appendChild(el('div', 'card-title', article.title));
    if (article.desc) body.appendChild(el('div', 'card-desc', article.desc));

    const footer = el('div', 'card-footer');
    const dateSpan = el('span', 'card-date', formatDate(article.date));
    if (article.date) dateSpan.title = fullDate(article.date);
    footer.appendChild(dateSpan);
    footer.appendChild(el('span', 'card-link-icon', 'Lesen →'));
    body.appendChild(footer);
    card.appendChild(body);

    card.addEventListener('click', (e) => {
      // Let ctrl/cmd/middle-click open the original article in a new tab
      if (e.ctrlKey || e.metaKey || e.button === 1) return;
      e.preventDefault();
      openModal(article);
    });

    return card;
  }

  function renderCards(articleList) {
    articles.replaceChildren(...articleList.map(makeCard));
  }

  // ── Modal ─────────────────────────────────────────────────────────────────

  let lastFocused = null;

  function openModal(article) {
    modal.replaceChildren();

    if (article.imgUrl) {
      const hero = el('img', 'modal-hero');
      hero.src = article.imgUrl;
      hero.alt = article.title;
      hero.setAttribute('referrerpolicy', 'no-referrer');
      hero.addEventListener('error', () => hero.remove());
      modal.appendChild(hero);
    }

    const body = el('div', 'modal-body');

    const meta = el('div', 'modal-meta');
    if (article.cat) meta.appendChild(el('span', 'modal-category', article.cat));
    if (article.date) meta.appendChild(el('span', 'modal-date', fullDate(article.date)));
    if (meta.childNodes.length) body.appendChild(meta);

    body.appendChild(el('h2', 'modal-title', article.title));

    const paragraphs = article.paragraphs.length
      ? article.paragraphs
      : (article.desc ? [article.desc] : []);
    if (paragraphs.length) {
      const descBox = el('div', 'modal-desc');
      paragraphs.forEach(p => descBox.appendChild(el('p', '', p)));
      body.appendChild(descBox);
    }

    const actions = el('div', 'modal-actions');
    if (article.link) {
      const open = el('a', 'btn-primary', 'Artikel öffnen ↗');
      open.href = article.link;
      open.target = '_blank';
      open.rel = 'noopener';
      actions.appendChild(open);
    }
    const close = el('button', 'btn-ghost', '✕ Schließen');
    close.addEventListener('click', closeModal);
    actions.appendChild(close);
    body.appendChild(actions);
    modal.appendChild(body);

    lastFocused = document.activeElement;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    close.focus();
  }

  function closeModal() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
    lastFocused = null;
  }

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
  });

  // ── Load feed ─────────────────────────────────────────────────────────────

  // Decode allorigins base64 data URI: "data:...;base64,XXXX"
  function decodeDataUri(s) {
    const m = /^data:[^,]*?;base64,(.*)$/s.exec(s);
    if (!m) return s;
    try {
      // atob -> binary string -> UTF-8 string
      const bin = atob(m[1]);
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      return new TextDecoder('utf-8').decode(bytes);
    } catch {
      return s;
    }
  }

  async function fetchWithFallback(feedUrl) {
    // 1. allorigins (returns JSON with base64 data URI in `contents`)
    try {
      const url = `https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl)}`;
      const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
      if (res.ok) {
        const data = await res.json();
        if (data && data.contents) return decodeDataUri(data.contents);
      }
    } catch {}

    // 2. allorigins /raw – returns raw text directly
    try {
      const url = `https://api.allorigins.win/raw?url=${encodeURIComponent(feedUrl)}`;
      const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
      if (res.ok) {
        const txt = await res.text();
        if (txt && txt.trim().startsWith('<')) return txt;
      }
    } catch {}

    // 3. corsproxy.io
    try {
      const url = `https://corsproxy.io/?url=${encodeURIComponent(feedUrl)}`;
      const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
      if (res.ok) {
        const txt = await res.text();
        if (txt && txt.trim().startsWith('<')) return txt;
      }
    } catch {}

    // 4. Direct fetch (works if feed allows CORS)
    const res = await fetch(feedUrl, { signal: AbortSignal.timeout(10000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.text();
  }

  let loadSeq = 0; // guards against a slow older request overwriting a newer one

  async function loadFeed(feedUrl) {
    const seq = ++loadSeq;
    showLoading();

    let xml;
    try {
      xml = await fetchWithFallback(feedUrl);
    } catch (err) {
      if (seq !== loadSeq) return;
      showError('Feed konnte nicht geladen werden.', err.message);
      return;
    }
    if (seq !== loadSeq) return;

    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    if (doc.querySelector('parsererror')) {
      showError('Feed konnte nicht geparst werden – ist die URL ein gültiger RSS/Atom-Feed?');
      return;
    }

    // Support RSS 2.0 + Atom
    let items = [...doc.querySelectorAll('channel > item')];
    if (!items.length) items = [...doc.querySelectorAll('entry')]; // Atom

    if (!items.length) {
      showError('Im Feed wurden keine Artikel gefunden.');
      return;
    }

    // Newest first; items without a date sort to the end
    const parsed = items.map(parseItem)
      .sort((a, b) => (b.date?.getTime() || 0) - (a.date?.getTime() || 0));

    const channel = doc.querySelector('channel') || doc.querySelector('feed');
    renderFeedMeta(channel, parsed.length);
    renderCards(parsed);

    // Make the loaded feed shareable via ?feed=… (skip on file:// etc.)
    try {
      const u = new URL(location.href);
      if (feedUrl === DEFAULT_FEED) u.searchParams.delete('feed');
      else u.searchParams.set('feed', feedUrl);
      history.replaceState(null, '', u);
    } catch {}
  }

  // ── Init ──────────────────────────────────────────────────────────────────

  loadBtn.addEventListener('click', () => {
    const url = urlInput.value.trim() || DEFAULT_FEED;
    loadFeed(url);
  });

  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadBtn.click();
  });

  // Auto-load: ?feed=… parameter wins, otherwise the default feed
  let initialFeed = DEFAULT_FEED;
  try {
    const requested = sanitizeUrl(new URLSearchParams(location.search).get('feed') || '');
    if (requested) {
      initialFeed = requested;
      urlInput.value = requested;
    }
  } catch {}
  loadFeed(initialFeed);
</script>
</body>
</html>
